services:
  api:
    image: marathon-api:v1
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marathon
      POSTGRES_PASSWORD: marathon123
      POSTGRES_DB: marathondb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
